name: Watchdog do portal

# Confere se a SEMANA CORRENTE já foi gerada e, se não foi, re-dispara o clipping.
#
# Por que olhar o DADO e não o run: um run que falha é só um dos modos de falha.
# O cron pode ser desativado pelo GitHub (60 dias sem atividade) ou simplesmente
# não disparar, o motor pode "passar" sem commitar nada, o Gemini pode devolver
# 200 com JSON truncado. Nenhum desses acende alerta de falha.
#
# Por que a SEMANA e não a IDADE EM DIAS: o produto é semanal, e "dias desde a
# última geração" só aproxima isso — mal, justamente quando mais importa. Em
# 2026-07-26 (domingo) o watchdog resgatou a W30 no último dia da janela; na
# segunda seguinte o dado tinha 1 dia de idade e parecia fresco, enquanto a W31
# nunca havia sido gerada. O critério antigo ficaria cego até quinta. A pergunta
# certa é binária: existe data/<semana ISO de hoje>.json e o ultimo.json aponta
# para ela? Idade em dias segue no relatório, como informação, não como decisão.
#
# Não usa Gemini nem LLM: é jq + data. O único custo é a cota do clipping quando
# ele de fato precisa ser re-disparado.
on:
  schedule:
    - cron: "0 16 * * *"   # diário, 16h UTC (13h Divinópolis) — ~6h após o clipping
  workflow_dispatch:

permissions:
  contents: read
  actions: write   # re-disparar clipping.yml
  issues: write    # escalar para o humano

env:
  MAX_TENTATIVAS: 2   # teto de re-disparos em 48h — evita loop queimando cota
  JANELA_HORAS: 48

jobs:
  conferir:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Conferir se a semana corrente já foi gerada
        id: frescor
        run: |
          set -euo pipefail

          # %G-%V = ano+semana ISO, o MESMO calendário que motor.py usa em
          # periodo_atual() (date.today().isocalendar()). Runner e motor rodam
          # ambos em UTC, então as duas contas fecham.
          semana=$(date -u +%G-W%V)
          arquivo="data/${semana}.json"
          apontado=$(jq -r '.periodo // empty' data/ultimo.json 2>/dev/null || true)
          gerado=$(jq -r '.gerado_em // empty' data/ultimo.json 2>/dev/null || true)
          label=$(jq -r '.label // "?"' data/ultimo.json 2>/dev/null || echo "?")

          # A conversão da data fica dentro do if: sob 'set -e', um gerado_em
          # malformado mataria o passo aqui — e o watchdog morrer calado é
          # exatamente a falha silenciosa que ele existe para evitar.
          if [ -n "$gerado" ] && ts=$(date -u -d "$gerado" +%s 2>/dev/null); then
            idade=$(( ( $(date -u +%s) - ts ) / 86400 ))
          else
            idade=999
            label="ultimo.json ilegível"
          fi

          # Duas condições, porque são dois modos de falha distintos: o arquivo da
          # semana pode não existir (motor não rodou/não commitou), ou existir sem
          # que o ultimo.json tenha avançado (portal servindo semana velha).
          motivo=""
          if [ ! -f "$arquivo" ]; then
            motivo="$arquivo não existe — a semana corrente nunca foi gerada"
          elif [ "$apontado" != "$semana" ]; then
            motivo="ultimo.json aponta para '${apontado:-vazio}', não para $semana"
          fi

          echo "Semana corrente: $semana | ultimo.json: ${apontado:-vazio} ('$label', $idade dia(s))"
          {
            echo "semana=$semana"
            echo "idade=$idade"
            echo "label=$label"
          } >> "$GITHUB_OUTPUT"

          if [ -z "$motivo" ]; then
            echo "fresco=true" >> "$GITHUB_OUTPUT"
          else
            echo "PARADO: $motivo"
            echo "fresco=false" >> "$GITHUB_OUTPUT"
            echo "motivo=$motivo" >> "$GITHUB_OUTPUT"
          fi

      - name: Portal em dia — nada a fazer
        if: steps.frescor.outputs.fresco == 'true'
        run: |
          echo "✅ Semana ${{ steps.frescor.outputs.semana }} gerada (${{ steps.frescor.outputs.idade }} dia(s)). Sem ação." \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Decidir entre re-disparar ou escalar
        if: steps.frescor.outputs.fresco == 'false'
        id: decidir
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Já tem clipping rodando agora? Então só esperar — não empilhar.
          rodando=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/clipping.yml/runs?per_page=10" \
            --jq '[.workflow_runs[] | select(.status != "completed")] | length')
          if [ "$rodando" -gt 0 ]; then
            echo "Já existe clipping em execução — aguardando o desfecho."
            echo "acao=aguardar" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Quantas tentativas já houve na janela? Conta QUALQUER disparo manual
          # (do watchdog ou seu), não só os que falharam: assim o teto também
          # segura o caso em que o run "passa" mas não atualiza nada.
          desde=$(date -u -d "$JANELA_HORAS hours ago" +%Y-%m-%dT%H:%M:%SZ)
          tentativas=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/clipping.yml/runs?event=workflow_dispatch&per_page=30" \
            --jq "[.workflow_runs[] | select(.created_at > \"$desde\")] | length")
          echo "Tentativas nas últimas ${JANELA_HORAS}h: $tentativas (teto: $MAX_TENTATIVAS)"

          if [ "$tentativas" -lt "$MAX_TENTATIVAS" ]; then
            echo "acao=disparar" >> "$GITHUB_OUTPUT"
          else
            echo "acao=escalar" >> "$GITHUB_OUTPUT"
          fi
          echo "tentativas=$tentativas" >> "$GITHUB_OUTPUT"

      - name: Re-disparar o clipping
        if: steps.decidir.outputs.acao == 'disparar'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # via env, não interpolado direto no script: o motivo carrega texto vindo
          # do ultimo.json, e ${{ }} dentro de run: é substituição literal no shell.
          MOTIVO: ${{ steps.frescor.outputs.motivo }}
        run: |
          set -euo pipefail
          gh workflow run clipping.yml --ref "${GITHUB_REF_NAME}"
          echo "🔁 $MOTIVO — clipping re-disparado." >> "$GITHUB_STEP_SUMMARY"

      - name: Escalar para o humano
        if: steps.decidir.outputs.acao == 'escalar'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IDADE: ${{ steps.frescor.outputs.idade }}
          SEMANA: ${{ steps.frescor.outputs.semana }}
          LABEL: ${{ steps.frescor.outputs.label }}
          MOTIVO: ${{ steps.frescor.outputs.motivo }}
          TENTATIVAS: ${{ steps.decidir.outputs.tentativas }}
        run: |
          set -euo pipefail
          gh label create portal-parado --color B60205 \
            --description "Portal sem atualizar além do limite" 2>/dev/null || true

          # Um alerta por episódio: se já tem issue aberta, não abre outra.
          abertas=$(gh issue list --label portal-parado --state open --json number --jq 'length')
          if [ "$abertas" -gt 0 ]; then
            echo "Já existe alerta aberto — não vou duplicar."
            echo "🔔 Alerta já aberto; portal segue parado." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Link direto do run que falhou — é a primeira coisa que o humano abre.
          log_falha=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/clipping.yml/runs?per_page=10" \
            --jq '[.workflow_runs[] | select(.conclusion == "failure")][0].html_url // empty')
          [ -n "$log_falha" ] || \
            log_falha="https://github.com/$GITHUB_REPOSITORY/actions/workflows/clipping.yml"

          # ATRIBUÍDA ao dono do repo: atribuição é gatilho de notificação por si só,
          # independente de estar "watching". Sem isso o alerta depende do mesmo
          # caminho ambiente que já falhou uma vez.
          gh issue create \
            --label portal-parado \
            --assignee "$GITHUB_REPOSITORY_OWNER" \
            --title "Semana $SEMANA não gerada (portal em '$LABEL')" \
            --body "$(cat <<EOF
          A semana corrente (**$SEMANA**) não está no ar: $MOTIVO.
          O portal segue servindo '$LABEL', gerado há $IDADE dia(s).
          O watchdog re-disparou o clipping ${TENTATIVAS}x nas últimas ${JANELA_HORAS}h sem sucesso
          e parou de tentar, para não queimar cota do Gemini à toa.

          **Nada foi perdido** — os dados vivem no git. O portal está velho, não corrompido.

          ## 1. Abrir o log que falhou

          $log_falha

          ## 2. Identificar o erro

          | No log aparece | Causa provável | O que fazer |
          |---|---|---|
          | \`RESOURCE_EXHAUSTED\` + \`PerDay\` | cota diária do Gemini | esperar a virada (meia-noite, Pacífico) e re-disparar |
          | \`500\` / \`503\` / \`UNAVAILABLE\` repetido | instabilidade do Google | re-disparar mais tarde; o motor já tenta 4x sozinho |
          | \`401\` / \`403\` / \`API key not valid\` | secret vencido | renovar **GEMINI_API_KEY** em Settings → Secrets → Actions |
          | \`JSON inválido/truncado\` nas 4 tentativas | resposta grande demais para o teto | reduzir \`THINKING_COLETA\` ou o escopo do prompt em \`motor.py\` |
          | traceback novo em \`motor.py\` | mudança de API ou bug | precisa de correção no código |

          ## 3. Re-disparar

              gh workflow run clipping.yml --ref main

          Ou: aba **Actions** → **Clipping Semanal** → **Run workflow**.

          ## 4. Fechar esta issue

          Enquanto ela estiver aberta o watchdog não abre outra — e volta a abrir uma nova
          se o problema repetir. O critério é binário: a issue deixa de fazer sentido
          assim que \`data/${SEMANA}.json\` existir e o \`ultimo.json\` apontar para ela.
          EOF
          )"
          echo "🔔 Alerta aberto e atribuído a $GITHUB_REPOSITORY_OWNER." >> "$GITHUB_STEP_SUMMARY"
